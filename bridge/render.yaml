services:
  - type: web
    name: voicesre-bridge
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.mjs
    envVars:
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_AGENT_ID
        sync: false
      - key: SIGNALWIRE_SPACE_URL
        sync: false
      - key: SIGNALWIRE_PROJECT_ID
        sync: false
      - key: SIGNALWIRE_API_TOKEN
        sync: false
      - key: SIGNALWIRE_PHONE_NUMBER
        sync: false
      - key: ON_CALL_PHONE_NUMBER
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: NEXT_WEBHOOK_URL
        sync: false
